<script>
(() => {
  const filters = document.querySelector('#place-filters');
  const gallery = document.querySelector('#photos');
  const count = document.querySelector('#photo-count');
  const figures = [...gallery.querySelectorAll('figure[data-place]')];
  const buttons = [...filters.querySelectorAll('button[data-place]')];
  let shown = figures;
  filters.hidden = false;
  filters.addEventListener('click', (event) => {
    const button = event.target.closest('button[data-place]');
    if (!buttons.includes(button)) return;
    const place = button.dataset.place;
    for (const other of buttons) other.setAttribute('aria-pressed', String(other === button));
    shown = figures.filter((figure) => {
      figure.hidden = place !== 'all' && figure.dataset.place !== place;
      return !figure.hidden;
    });
    count.textContent = `${shown.length} ${shown.length === 1 ? 'photo' : 'photos'}`;
  });

  const dialog = document.querySelector('#lightbox');
  if (!dialog || typeof dialog.showModal !== 'function') return;
  const close = dialog.querySelector('.lightbox-close');
  const prev = dialog.querySelector('.lightbox-prev');
  const next = dialog.querySelector('.lightbox-next');
  const image = dialog.querySelector('img');
  const caption = dialog.querySelector('figcaption');
  let active = [];
  let index = 0;
  let opener;
  function render(target) {
    index = (target + active.length) % active.length;
    const link = active[index];
    image.src = link.href;
    image.alt = link.querySelector('img').alt;
    caption.textContent = image.alt;
  }
  gallery.addEventListener('click', (event) => {
    const link = event.target.closest('a[data-gallery]');
    if (!link || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
    active = shown.map(figure => figure.querySelector('a[data-gallery]'));
    const clicked = active.indexOf(link);
    if (clicked < 0) return;
    event.preventDefault();
    opener = link;
    prev.disabled = next.disabled = active.length < 2;
    render(clicked);
    dialog.showModal();
  });
  close.addEventListener('click', () => dialog.close());
  prev.addEventListener('click', () => render(index - 1));
  next.addEventListener('click', () => render(index + 1));
  dialog.addEventListener('click', (event) => { if (event.target === dialog) dialog.close(); });
  dialog.addEventListener('keydown', (event) => {
    if (active.length < 2 || !['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
    event.preventDefault();
    render(index + (event.key === 'ArrowLeft' ? -1 : 1));
  });
  dialog.addEventListener('close', () => opener?.focus());
})();
</script>
